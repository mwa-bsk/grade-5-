und:#fff08c}.btn{display:inline-block;border-radius:19px;padding:14px 28px;font-weight:900;font-size:20px;color:#48356c;background:linear-gradient(#fff4a4,#ffc651);box-shadow:0 7px 0 #e5a13c,0 12px 20px #5553a633;transition:transform .15s}.btn:hover{transform:translateY(-3px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e5a13c}.btn.alt{background:linear-gradient(#8ff5fa,#4cc3e9);box-shadow:0 7px 0 #2b9bbf}.input{border:3px solid #b6a3f1;border-radius:17px;background:white;padding:15px;font-size:21px;width:min(100%,350px);text-align:center;color:#263b73}.field{margin:16px 0}.notice{padding:12px 18px;background:#e7f7ff;border:2px solid #a8e1ff;border-radius:16px;font-size:16px;max-width:710px;margin:15px auto}.badge{display:inline-block;padding:9px 17px;background:#f4eaff;border:2px solid #d8c4ff;border-radius:25px;font-weight:bold}.hud{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.hud span{background:white;border:2px solid #d4c9fa;padding:10px 16px;border-radius:16px;font-weight:900}.bar{height:18px;max-width:680px;margin:10px auto 20px;background:#d9d5f1;border-radius:20px;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#6ce1e5,#f9cb54);transition:width .6s}.card{border-radius:23px;border:3px solid #d4c4ff;background:#fff;padding:22px;box-shadow:0 8px 0 #e4d9fa;max-width:790px;margin:16px auto}.question{font-size:clamp(21px,3vw,29px);font-weight:900;line-height:1.7}.sentence{font-size:clamp(22px,3vw,32px);font-weight:900;color:#6947aa;background:#f3edff;border-radius:16px;padding:14px;margin:12px auto}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px auto;max-width:750px}.option{min-height:70px;border:3px solid #b6c9f5;border-radius:18px;background:linear-gradient(#fff,#eef6ff);color:#35498a;font-size:clamp(17px,2.4vw,24px);font-weight:900;padding:12px;box-shadow:0 5px 0 #b6c9f5}.option:hover{background:#fff4c5}.option:disabled{cursor:default}.feedback{font-size:20px;font-weight:900;min-height:55px;padding:12px}.success{color:#15855b}.wrong{color:#b64663}.shake{animation:shake .5s}.rewind .ring{animation:spinBack .7s linear 3}.rewind .core{animation:rewindPulse .45s 4}.rewind .tiko{animation:jumpBack .65s ease-in-out 3}.pieces{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px auto}.piece{padding:9px 16px;border-radius:15px;background:#ffe8a5;border:2px solid #ffc95a;font-weight:900}.leader{max-width:680px;margin:18px auto;border-collapse:separate;border-spacing:0 9px;width:100%;font-size:19px}.leader td,.leader th{padding:13px;background:#fff;border-bottom:2px solid #e2d9ff}.leader th{background:#dfd0ff}.leader tr.mine td{background:#fff0ba}.confetti{position:fixed;z-index:20;top:-30px;width:12px;height:18px;pointer-events:none;animation:fall 3s linear forwards}.teacher-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;max-width:760px;margin:20px auto}.teacher-grid .card{margin:0}.small{font-size:14px}.error{color:#b3334c;font-weight:800}.footer{margin-top:25px;font-size:13px;color:#53629b}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinBack{to{transform:rotate(-360deg)}}@keyframes pulse{50%{box-shadow:inset 0 0 55px #fff,0 0 30px #f6f}}@keyframes rewindPulse{50%{transform:scale(.8);filter:hue-rotate(140deg)}}@keyframes bob{50%{transform:translateY(-14px)}}@keyframes jumpBack{50%{transform:translateX(-45px) translateY(-28px) rotate(-12deg)}}@keyframes shake{25%{transform:translateX(9px)}75%{transform:translateX(-9px)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:650px){.scene{padding:16px 12px;min-height:570px}.world{height:185px;gap:8px;transform:scale(.8);margin:-10px}.options{grid-template-columns:1fr}.option{min-height:56px}.top{align-items:flex-start}.brand{font-size:17px}.mini{padding:8px}.teacher-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!imp </style></head><body><div class="sky"><div class="cloud"></div><div class="cloud"></div></div><main class="wrap"><header class="top"><div class="brand">⏳ مغامرة آلة الزمن <span class="small">| الصف الخامس</span></div><div class="actions"><button class="mini" id="soundBtn">🔊 الصوت</button><button class="mini" id="fullBtn">⛶ ملء الشاشة</button><button class="mini" id="homeBtn">⌂ البداية</button></div></header><section class="scene" id="scene"><div id="content"></div></section><div class="footer" style="text-align:center">درس علامات إعراب المبتدأ والخبر • لعبة تعليمية تفاعلية</div></main><script>
'use strict';
/* إعداد المشاركة: ألصق رابط Firebase Realtime Database بعد إنشاء قاعدة بيانات مجانية. يجب تفعيل قواعد الأمان المناسبة قبل مشاركة الرابط. */
const CONFIG={databaseURL:'',classroomCode:'TIME5',teacherPin:'mwa',pollMs:8000};
/* بنك التحديات: يمكن للمعلم تعديل النصوص والاختيارات والإجابات هنا. index يبدأ من صفر. */
const QUESTIONS=[
{type:'عكس البنية',sentence:'التلميذُ مجتهدٌ',q:'لنرجع خطوة إلى الخلف: ما المبتدأ في هذه الجملة؟',options:['مجتهدٌ','التلميذُ','التلميذُ مجتهدٌ','لا يوجد مبتدأ'],answer:1,parts:['الجملة الاسمية','التلميذُ + مجتهدٌ']},
{type:'عكس البنية',sentence:'التلميذُ مجتهدٌ',q:'ما الخبر الذي يُتمّ معنى الجملة؟',options:['التلميذُ','مجتهدٌ','التلميذُ مجتهدٌ','لا يوجد خبر'],answer:1,parts:['التلميذُ + مجتهدٌ','الخبر: مجتهدٌ']},
{type:'عكس الدليل',sentence:'التلميذُ مجتهدٌ',q:'ما علامة رفع المبتدأ «التلميذُ»؟',options:['الألف','الواو','الضمة','الكسرة'],answer:2,parts:['التلميذُ','مفرد','الضمة']},
{type:'عكس البنية',sentence:'التلميذانِ مجتهدانِ',q:'ما نوع المبتدأ «التلميذانِ»؟',options:['مفرد','مثنى','جمع تكسير','جمع مؤنث سالم'],answer:1,parts:['التلميذانِ','مثنى']},
{type:'عكس الدليل',sentence:'التلميذانِ مجتهدانِ',q:'ما علامة رفع المبتدأ المثنى؟',options:['الواو','الضمة','الألف','الياء'],answer:2,parts:['التلميذانِ','مثنى','الألف']},
{type:'عكس البنية',sentence:'المعلمونَ مخلصونَ',q:'ما نوع المبتدأ «المعلمونَ»؟',options:['جمع مذكر سالم','جمع مؤنث سالم','مثنى','جمع تكسير'],answer:0,parts:['المعلمونَ','جمع مذكر سالم']},
{type:'عكس الدليل',sentence:'المعلمونَ مخلصونَ',q:'ما علامة رفع جمع المذكر السالم؟',options:['الضمة','الألف','الواو','الفتحة'],answer:2,parts:['المعلمونَ','جمع مذكر سالم','الواو']},
{type:'عكس الحل',sentence:'المعلماتُ مخلصاتٌ',q:'اختر علامة رفع المبتدأ «المعلماتُ».',options:['الألف','الواو','الضمة','الياء'],answer:2,parts:['المعلماتُ','جمع مؤنث سالم','الضمة']},
{type:'عكس الدليل',sentence:'التلاميذُ مجتهدونَ',q:'ما نوع المبتدأ «التلاميذُ»؟',options:['مثنى','جمع تكسير','جمع مذكر سالم','مفرد'],answer:1,parts:['التلاميذُ','جمع تكسير']},
{type:'إصلاح الزمن',sentence:'التلاميذُ مجتهدونَ',q:'ما علامة رفع المبتدأ «التلاميذُ»؟',options:['الواو','الألف','الضمة','الياء'],answer:2,parts:['التلاميذُ','جمع تكسير','الضمة']}
];
const el=document.getElementById('content'),scene=document.getElementById('scene');let player='',code='',step=0,score=0,attempts=0,locked=false,sound=true,audio,sessionId='',leaderTimer=null,mode='welcome';const max=1200;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const online=()=>!!CONFIG.databaseURL.trim();const key=s=>encodeURIComponent(s).replace(/\./g,'%2E');
function audioPlay(ok=true){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?540:210,audio.currentTime);o.frequency.exponentialRampToValueAtTime(ok?940:130,audio.currentTime+.2);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.26);o.start();o.stop(audio.currentTime+.27)}catch(e){}}
function avatar(){return '<div class="tiko" aria-label="تيكو حارس الزمن"><div class="antenna"></div><div class="head"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div><div class="body"></div></div>'}
function machine(){return '<div class="world">'+avatar()+'<div class="machine"><div class="ring"></div><div class="core">↶</div><div class="feet"></div></div></div>'}
function render(html){el.innerHTML=html;scene.classList.remove('shake','rewind')}
function welcome(){clearInterval(leaderTimer);mode='welcome';render('<h1>مغامرة آلة الزمن</h1><div class="badge">REWIND QUEST • علامات إعراب المبتدأ والخبر</div>'+machine()+'<p class="sub">يا بطل، ساعد تيكو في إصلاح الزمن! اجتز ١٠ بوابات لغوية.</p><div class="field"><input id="name" class="input" maxlength="28" autocomplete="off" placeholder="اكتب اسمك هنا" aria-label="اسم الطالب"></div><div class="field"><input id="code" class="input" maxlength="30" autocomplete="off" placeholder="رمز الفصل" aria-label="رمز الفصل" value="'+esc(CONFIG.classroomCode)+'"></div><p id="loginErr" class="error" aria-live="polite"></p><button class="btn" id="join">🚀 ابدأ المغامرة</button><p class="notice">🏆 تظهر لوحة المتصدرين بعد إكمال جميع التحديات فقط. لا توجد تلميحات.</p><button class="mini" id="teacherOpen">👩‍🏫 لوحة المعلم</button>');document.getElementById('join').onclick=join;document.getElementById('teacherOpen').onclick=teacherLogin}
function join(){let n=document.getElementById('name').value.trim(),c=document.getElementById('code').value.trim();if(n.length<2||c.length<2){document.getElementById('loginErr').textContent='اكتب اسمًا من حرفين على الأقل ورمز الفصل.';return}player=n;code=c;sessionId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);step=score=attempts=0;intro()}
function intro(){mode='intro';render('<h2>⚡ حدث خلل في الزمن!</h2>'+machine()+'<div class="card"><p class="question">أوه! ظهرت الجمل مكتملة، واختفت أسرار بنائها!</p><p class="sub">سنرجع من الجملة إلى أجزائها، ثم نكشف نوع المبتدأ وعلامة رفعه. كل إجابة صحيحة تعيد جزءًا من الزمن!</p></div><button class="btn" id="go">⏪ لنعد بالزمن</button>');document.getElementById('go').onclick=challenge}
function challenge(){mode='challenge';locked=false;attempts=0;showChallenge()}
function showChallenge(){let q=QUESTIONS[step];render('<div class="hud"><span>👤 '+esc(player)+'</span><span>🔮 البوابة '+(step+1)+' / '+QUESTIONS.length+'</span><span>⭐ '+score+' نقطة</span></div><div class="bar"><div style="width:'+(step/QUESTIONS.length*100)+'%"></div></div><div class="badge">'+esc(q.type)+'</div><div class="world" style="height:175px;transform:scale(.75);margin:-10px 0">'+avatar()+'<div class="machine"><div class="ring"></div><div class="core">↶</div></div></div><div class="card"><div class="sentence">'+esc(q.sentence)+'</div><div class="question">'+esc(q.q)+'</div><div class="options">'+q.options.map((o,i)=>'<button class="option" data-opt="'+i+'">'+esc(o)+'</button>').join('')+'</div><div class="feedback" id="feedback" aria-live="polite"></div><div id="reveal"></div><button class="btn hidden" id="next">'+(step===QUESTIONS.length-1?'🏆 إنهاء المغامرة':'⏪ البوابة التالية')+'</button></div>');document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.opt)));document.getElementById('next').onclick=next}
function answer(i){if(locked)return;attempts++;const q=QUESTIONS[step],fb=document.getElementById('feedback');if(i!==q.answer){audioPlay(false);scene.classList.remove('shake');void scene.offsetWidth;scene.classList.add('shake');fb.className='feedback wrong';fb.textContent='⏳ تعثّرت آلة الزمن! حاول مرة أخرى.';document.querySelector('[data-opt="'+i+'"]').disabled=true;return}locked=true;let pts=attempts===1?100:attempts===2?60:30;score+=pts;audioPlay(true);scene.classList.add('rewind');document.querySelectorAll('[data-opt]').forEach(b=>b.disabled=true);fb.className='feedback success';fb.textContent='✨ رائع! عادت عجلة الزمن للخلف! +'+pts+' نقطة';document.getElementById('reveal').innerHTML='<div class="pieces">'+q.parts.slice().reverse().map(p=>'<span class="piece">'+esc(p)+'</span>').join(' ⟵ ')+'</div>';document.getElementById('next').classList.remove('hidden')}
function next(){if(!locked)return;step++;if(step===QUESTIONS.length){score+=200;finish()}else challenge()}
function localRead(){try{return JSON.parse(localStorage.getItem('rewindScores:'+code)||'[]')}catch(e){return []}}
function localWrite(row){let rows=localRead();rows.push(row);localStorage.setItem('rewindScores:'+code,JSON.stringify(rows))}
async function remoteGet(){const r=await fetch(CONFIG.databaseURL.replace(/\/$/,'')+'/rooms/'+key(code)+'/scores.json');if(!r.ok)throw Error('تعذّر تحميل النتائج');const data=await r.json();return Object.values(data||{})}
async function remoteWrite(row){const r=await fetch(CONFIG.databaseURL.replace(/\/$/,'')+'/rooms/'+key(code)+'/scores/'+key(sessionId)+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)});if(!r.ok)throw Error('تعذّر حفظ النتيجة')}
async function getScores(){return online()?remoteGet():localRead()}
function sorted(rows){return rows.filter(r=>r&&typeof r.score==='number'&&typeof r.name==='string').sort((a,b)=>b.score-a.score||a.finished-b.finished)}
function table(rows){const s=sorted(rows);return '<table class="leader"><thead><tr><th>الترتيب</th><th>البطل</th><th>النقاط</th></tr></thead><tbody>'+ (s.length?s.slice(0,50).map((r,i)=>'<tr class="'+(r.id===sessionId?'mine':'')+'"><td>'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1)+'</td><td>'+esc(r.name)+'</td><td>'+r.score+'</td></tr>').join(''):'<tr><td colspan="3">لا توجد نتائج بعد</td></tr>')+'</tbody></table>'}
async function finish(){mode='finish';let row={id:sessionId,name:player,score,finished:Date.now()};render('<h1>🎉 أصلحتَ آلة الزمن!</h1>'+machine()+'<h2>أحسنت يا '+esc(player)+'!</h2><div class="badge">⭐ نتيجتك: '+score+' / '+max+'</div><p class="sub">اكتملت البوابات العشر! جاري تسجيل نتيجتك...</p><div id="results" class="card">⏳ تحميل لوحة المتصدرين...</div><button class="btn" id="again">🔄 العب مجددًا</button>');document.getElementById('again').onclick=welcome;celebrate();try{if(online())await remoteWrite(row);else localWrite(row);await refreshBoard();leaderTimer=setInterval(()=>{if(mode==='finish')refreshBoard()},CONFIG.pollMs)}catch(e){document.getElementById('results').innerHTML='<p class="error">تعذّر الاتصال بلوحة المتصدرين. تحقق من اتصال الإنترنت وإعدادات قاعدة البيانات.</p><button class="btn alt" id="retry">إعادة المحاولة</button>';document.getElementById('retry').onclick=async()=>{try{if(online())await remoteWrite(row);else localWrite(row);await refreshBoard()}catch(e){alert('ما زال الاتصال غير متاح')}}}}
async function refreshBoard(){let rows=await getScores();if(mode!=='finish'&&mode!=='teacher')return;let target=document.getElementById('results');if(target)target.innerHTML='<h2>🏆 لوحة المتصدرين</h2>'+table(rows)+(online()?'<p class="small">تُحدّث النتائج تلقائيًا كل عدة ثوانٍ.</p>':'<p class="notice">⚠️ وضع العرض المحلي: هذه النتائج تظهر على هذا الجهاز فقط. لتفعيل لوحة مشتركة، اضبط قاعدة البيانات.</p>')}
function celebrate(){for(let i=0;i<45;i++){let d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=['#ffd35d','#7ddfff','#bd94f7','#ff95bc'][i%4];d.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}}
function teacherLogin(){mode='teacherLogin';render('<h1>👩‍🏫 لوحة المعلم</h1>'+machine()+'<p class="sub">أدخل رمز الفصل ورمز دخول المعلم</p><div class="field"><input class="input" id="room" placeholder="رمز الفصل" value="'+esc(CONFIG.classroomCode)+'"></div><div class="field"><input class="input" id="pin" type="password" placeholder="رمز المعلم"></div><p id="terr" class="error"></p><button class="btn" id="openDash">عرض النتائج</button><p class="notice">مهم: رمز المعلم داخل ملف HTML ليس حماية آمنة للبيانات. لا تستخدم هذه اللوحة مع معلومات شخصية حساسة.</p>');document.getElementById('openDash').onclick=()=>{if(document.getElementById('pin').value!==CONFIG.teacherPin){document.getElementById('terr').textContent='رمز المعلم غير صحيح';return}code=document.getElementById('room').value.trim();if(!code){document.getElementById('terr').textContent='أدخل رمز الفصل';return}dashboard()}}
async function dashboard(){mode='teacher';render('<h1>👩‍🏫 متابعة الفصل</h1><div class="hud"><span>الفصل: '+esc(code)+'</span><span>📡 '+(online()?'نتائج مشتركة عبر الإنترنت':'نتائج هذا الجهاز فقط')+'</span></div><div class="teacher-grid"><div class="card"><h2 id="count">—</h2><p>عدد المحاولات المكتملة</p></div><div class="card"><h2 id="best">—</h2><p>أعلى نتيجة</p></div></div><div id="results" class="card">جاري التحميل...</div><button class="btn alt" id="reload">تحديث النتائج</button>');document.getElementById('reload').onclick=updateTeacher;await updateTeacher();leaderTimer=setInterval(()=>{if(mode==='teacher')updateTeacher()},CONFIG.pollMs)}
async function updateTeacher(){try{const rows=sorted(await getScores());if(mode!=='teacher')return;document.getElementById('count').textContent=rows.length;document.getElementById('best').textContent=rows[0]?.score??'—';document.getElementById('results').innerHTML=table(rows)}catch(e){document.getElementById('results').innerHTML='<p class="error">تعذّر تحميل النتائج. تحقق من إعدادات الاتصال.</p>'}}
document.getElementById('soundBtn').onclick=()=>{sound=!sound;document.getElementById('soundBtn').textContent=sound?'🔊 الصوت':'🔇 صامت'};document.getElementById('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.getElementById('homeBtn').onclick=()=>{if(mode==='challenge'&&!confirm('هل تريد العودة إلى البداية؟ ستفقد تقدمك الحالي.'))return;welcome()};welcome();
</script></body></html>
